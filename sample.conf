[General]
# Sun elevation in degrees above the horizon. Above DimAbove the lighting is
# off; below FullBelow it reaches MaxBrightness. In between it ramps smoothly.
DimAbove = 10.0
FullBelow = -6.0

# Time zone. Accepts an IANA id, a Windows zone name, or an offset like +03:00.
TimeZone = Auto

# Let cloud cover raise the brightness: an overcast evening gets dark earlier.
# Only once the sun is below DimAbove; by day clouds are ignored.
WeatherCloud = true

# Lighting colour in #RRGGBB form.
BaseColor = #0078FF

# Maximum brightness, in percent. This is the figure the tooltip reports.
BaseBrightness = 100

# Perception curve applied on the way to the LED, so equal steps in percent
# look equal to the eye. 1.0 drives the LED directly.
Gamma = 2.2

# Lowest brightness the LEDs actually show, in percent. A calculated level
# below it counts as zero; the step up to it is still faded in smoothly.
VisibleFrom = 15

[DimOnLoad]
# React to processor and graphics load. Off by default: the point of this app
# is light that stays out of the way.
Enabled = false

# Color - blend the colour towards HiLoadColor.
# Pulse - keep BaseColor and breathe, dipping brightness by up to a third.
Effect = Color

# What to measure: CPU, GPU, or Max for whichever of the two is busier.
Source = Max

# Graphics engines counted as load. Video encoding is left out on purpose:
# a streaming tool keeps it busy while the machine idles. Use All for every one.
GpuEngines = 3D, Compute

# Colour at full load. Only used by the Color effect.
HiLoadColor = #FF3000

# Seconds between load readings. Values below 1 are ignored.
Interval = 1

[General]
# Sun elevation in degrees: above DimAbove the lighting is off,
# below FullBelow it is at the Dynamic Lighting brightness, in between it ramps smoothly.
DimAbove = 10.0
FullBelow = -6.0

# Lowest brightness the LEDs actually show, in percent; lower levels count as zero.
VisibleFrom = 15

# IANA id, Windows zone name, offset like +03:00, or Auto.
TimeZone = Auto

# Cloud cover makes an overcast evening darker earlier. Ignored by day.
WeatherCloud = true

# Perception curve on the way to the LED; 1.0 drives it directly.
Gamma = 2.2

# React to CPU and GPU load: most effects tint, gradient and breathing pulse faster.
HardwareLoadSync = false
